version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Asia/Jakarta
    commit-message:
      prefix: "chore(deps)"
